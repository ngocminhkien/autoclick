<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <filter id="pixelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g filter="url(#pixelGlow)">
    <!-- Blade tip -->
    <rect x="2" y="2" width="2" height="2" fill="#ffffff"/>
    <rect x="4" y="2" width="2" height="2" fill="#e0f2fe"/>
    <rect x="2" y="4" width="2" height="2" fill="#e0f2fe"/>
    
    <!-- Blade body -->
    <rect x="4" y="4" width="2" height="2" fill="#38bdf8"/>
    <rect x="6" y="4" width="2" height="2" fill="#ffffff"/>
    <rect x="4" y="6" width="2" height="2" fill="#0284c7"/>
    <rect x="6" y="6" width="2" height="2" fill="#38bdf8"/>
    <rect x="8" y="6" width="2" height="2" fill="#ffffff"/>
    <rect x="6" y="8" width="2" height="2" fill="#0284c7"/>
    <rect x="8" y="8" width="2" height="2" fill="#38bdf8"/>
    <rect x="10" y="8" width="2" height="2" fill="#ffffff"/>
    <rect x="8" y="10" width="2" height="2" fill="#0284c7"/>
    <rect x="10" y="10" width="2" height="2" fill="#38bdf8"/>
    <rect x="12" y="10" width="2" height="2" fill="#ffffff"/>
    <rect x="10" y="12" width="2" height="2" fill="#0284c7"/>
    <rect x="12" y="12" width="2" height="2" fill="#38bdf8"/>
    <rect x="14" y="12" width="2" height="2" fill="#ffffff"/>
    <rect x="12" y="14" width="2" height="2" fill="#0284c7"/>
    <rect x="14" y="14" width="2" height="2" fill="#38bdf8"/>
    <rect x="16" y="14" width="2" height="2" fill="#ffffff"/>
    <rect x="14" y="16" width="2" height="2" fill="#0284c7"/>
    <rect x="16" y="16" width="2" height="2" fill="#38bdf8"/>
    
    <!-- Crossguard -->
    <rect x="12" y="20" width="2" height="2" fill="#fbbf24"/>
    <rect x="14" y="18" width="2" height="2" fill="#f59e0b"/>
    <rect x="16" y="18" width="2" height="2" fill="#d97706"/>
    <rect x="18" y="18" width="2" height="2" fill="#f59e0b"/>
    <rect x="18" y="16" width="2" height="2" fill="#fbbf24"/>
    <rect x="20" y="14" width="2" height="2" fill="#fbbf24"/>
    <rect x="10" y="22" width="2" height="2" fill="#b45309"/>
    
    <!-- Hilt -->
    <rect x="18" y="20" width="2" height="2" fill="#78350f"/>
    <rect x="20" y="22" width="2" height="2" fill="#78350f"/>
    <rect x="22" y="24" width="2" height="2" fill="#78350f"/>
    <!-- Pommel -->
    <rect x="24" y="26" width="3" height="3" fill="#fbbf24"/>
  </g>
</svg>
