<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="dotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#10b981" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Outer glowing pulse ring -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.8" filter="url(#dotGlow)"/>
  <circle cx="16" cy="16" r="6" fill="#10b981" fill-opacity="0.25"/>
  <!-- Center white-green dot -->
  <circle cx="16" cy="16" r="3.5" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
</svg>
