<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ff007f" flood-opacity="0.9"/>
    </filter>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="45%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
  </defs>
  <!-- Blade sword body -->
  <polygon points="3,3 8,3 27,22 22,27 3,8" 
           fill="url(#bladeGrad)" 
           stroke="#ffffff" 
           stroke-width="1.2" 
           filter="url(#cyberGlow)"/>
  <!-- Blade shine center line -->
  <line x1="6" y1="6" x2="22" y2="22" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  <!-- Hilt guard -->
  <line x1="20" y1="27" x2="27" y2="20" stroke="#00f3ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tip dot -->
  <circle cx="3" cy="3" r="1.5" fill="#ffe600"/>
</svg>
