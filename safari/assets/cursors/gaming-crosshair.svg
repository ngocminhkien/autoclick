<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="crossGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ef4444" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Outer circle with gap quarters -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 7" filter="url(#crossGlow)"/>
  <!-- Crosshair lines -->
  <line x1="16" y1="2" x2="16" y2="9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="23" x2="16" y2="30" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="2" y1="16" x2="9" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="23" y1="16" x2="30" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.5" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
</svg>
