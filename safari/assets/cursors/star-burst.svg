  </defs>
  <polygon points="16,2 19.5,12 30,16 19.5,20 16,30 12.5,20 2,16 12.5,12" 
           fill="url(#starGrad)" 
           stroke="#ffffff" 
           stroke-width="1.2" 
           filter="url(#starGlow)"/>
  <circle cx="16" cy="16" r="3" fill="#ffffff"/>
</svg>
